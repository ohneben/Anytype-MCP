name: Publish Docker image

# Builds the Streamable-HTTP server image and pushes it to the GitHub Container
# Registry (GHCR) whenever a version tag (v*.*.*) is pushed or a release is
# published. After the first publish, set the package visibility to Public in
# Packages -> anytype-mcp -> Package settings if you want anonymous `docker pull`.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anytype-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            io.modelcontextprotocol.server.name=io.github.ohneben/anytype-mcp

      # The running server reports package.json's version to MCP clients, and
      # server.json publishes the same number to the MCP Registry. The tag is the
      # source of truth for a release, so stamp it in before the image is built;
      # otherwise the container announces whatever version was last committed.
      - name: Stamp the release version into package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Refusing to build a malformed version '$version'."
            exit 1
          fi
          for f in package.json package-lock.json; do
            jq --arg v "$version" '
              .version = $v
              | if has("packages") and (.packages | has(""))
                then .packages[""].version = $v
                else . end
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          echo "Building version $(jq -r .version package.json)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
